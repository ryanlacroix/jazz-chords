# Builds the Godot web export and publishes it to GitHub Pages on every push
# to main. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; queue the newest push after it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT: ${{ github.workspace }}/../godot/godot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The full templates archive is ~1.3 GB, so only the non-threaded web
      # template (the one export_presets.cfg uses) is kept and cached.
      - name: Cache Godot and web template
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Download Godot and web template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$(dirname "$GODOT")"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$GODOT"
          chmod +x "$GODOT"

          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$templates"
          rm /tmp/templates.tpz

      # Builds the class cache (class_name scripts) before anything runs.
      - name: Import project
        run: timeout 300 "$GODOT" --headless --path . --import

      # Checks the summary line too: a script parse error doesn't change the exit code.
      - name: Run theory tests
        run: |
          timeout 120 "$GODOT" --headless --path . -s tests/test_theory.gd 2>&1 | tee /tmp/tests.log
          grep -q " checks, 0 failures" /tmp/tests.log

      - name: Export web build
        run: |
          mkdir -p build/web
          timeout 300 "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html && test -f build/web/index.wasm && test -f build/web/index.pck
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
